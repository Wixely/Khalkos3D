name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Three operating systems because the asset layer is meant to be identical on all of them, and
      # the failures that would break that promise are exactly the ones a single runner hides: path
      # separators, line endings, and the current culture. A comma-decimal machine parsing "1.5" as
      # 15 produces a model ten times too big with nothing to indicate why.
      - name: Build
        run: dotnet build Khalkos3D.slnx -c Release

      - name: Test
        run: dotnet test tests/Khalkos3D.Tests -c Release --no-build --logger "console;verbosity=normal"

  render:
    name: The renderer draws, on a real driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A GL stack and a display to attach it to. llvmpipe is software rasterisation, which is
      # honest about what it proves: the code path and the API usage, NOT the driver. Every rendering
      # defect in the related CupriFace work passed a check like this one and was found by a person
      # holding a phone. This gate catches regressions; it does not certify hardware.
      - name: Install Mesa and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri libglfw3

      # Printed before the tests so that a failure to get a context is diagnosable from this log
      # rather than from a local reproduction. That lesson was learned the expensive way on the wasm
      # job below.
      - name: What GL is available here
        run: xvfb-run -a glxinfo -B || echo "glxinfo failed; the tests will report the details"

      - name: Render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dotnet test tests/Khalkos3D.RenderTests -c Release --logger "console;verbosity=normal"

  dependencies:
    name: The shipped libraries depend on nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # THE LICENCE POLICY, ENFORCED RATHER THAN INTENDED. docs/LICENSING.md says Core and Formats
      # use nothing outside the BCL, and that claim is what makes them compile for WebAssembly, iOS
      # and Android with no per-platform matrix and nothing to sign. A policy that depends on
      # remembering is not a policy, so the zero is asserted here — including transitively, which is
      # where an unwanted licence would actually arrive.
      - name: No package references, direct or transitive
        run: |
          set -euo pipefail
          fail=0
          for project in src/Khalkos3D.Core src/Khalkos3D.Formats; do
            dotnet restore "$project" > /dev/null
            listing=$(dotnet list "$project" package --include-transitive 2>&1)
            if echo "$listing" | grep -qE '^\s+> '; then
              echo "::error::$project has package references; docs/LICENSING.md says it must have none"
              echo "$listing"
              fail=1
            else
              echo "ok: $project depends on nothing"
            fi
          done
          exit $fail

  wasm:
    name: The asset layer compiles for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm tooling
        run: dotnet workload install wasm-tools

      # The README claims these run in a browser. A claim about a target nobody builds for is one that
      # stops being true quietly — a single BCL call with no wasm implementation is all it takes, and
      # it would be found by a user rather than by us.
      #
      # The probe project is written out here rather than made with `dotnet new`, because the
      # wasmconsole template lives in the EXPERIMENTAL workload rather than wasm-tools. Targeting
      # net10.0-browser is the half that matters: it turns on the platform-compatibility analyser, so
      # an API that browser does not support becomes CA1416 — an error, since warnings are errors —
      # instead of a runtime failure in someone's tab.
      - name: The loaders compile and link for browser-wasm
        run: |
          set -euo pipefail
          rm -rf /tmp/wasmprobe && mkdir -p /tmp/wasmprobe && cd /tmp/wasmprobe

          cat > probe.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-browser</TargetFramework>
              <RuntimeIdentifier>browser-wasm</RuntimeIdentifier>
              <OutputType>Exe</OutputType>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="REPO/src/Khalkos3D.Formats/Khalkos3D.Formats.csproj" />
            </ItemGroup>
          </Project>
          CSPROJ
          sed -i "s|REPO|$GITHUB_WORKSPACE|" probe.csproj

          cat > Probe.cs <<'PROBE'
          using System;
          using System.IO;
          using Khalkos3D;
          using Khalkos3D.Formats;

          public static class Probe
          {
              // Called FROM Main, and that is load-bearing rather than tidy. A wasm publish trims,
              // and a method nothing reaches is a method ILLink deletes — along with the whole
              // assembly. An empty Main left the bundle with no Khalkos3D in it at all, which the
              // check below correctly reported as a failure.
              //
              // So this doubles as a trimming gate: every reader has to survive being linked into a
              // browser app, which is a property a consumer cares about and nothing else here tests.
              public static void Main()
              {
                  var bytes = new byte[]
                  {
                      // A one-triangle ASCII STL, so the call is real rather than a throw the
                      // trimmer might still see through.
                      0x73, 0x6F, 0x6C, 0x69, 0x64, 0x20, 0x78, 0x0A,
                  };
                  try
                  {
                      var scene = ModelReader.Read(bytes, "stl");
                      Console.WriteLine($"{scene.TriangleCount} {scene.Bounds} {BoundingBox.Empty.IsEmpty}");
                      Console.WriteLine(MeshWelder.Weld(scene.Meshes[0], out _).VertexCount);
                  }
                  catch (ModelFormatException e) { Console.WriteLine(e.Message); }

                  // Referenced so every reader is rooted; never executed.
                  Console.WriteLine(string.Join(',',
                      nameof(StlReader), nameof(ObjReader), nameof(ThreeMfReader), nameof(GltfReader)));
                  if (bytes.Length > 1000)
                  {
                      _ = StlReader.Read(new MemoryStream(bytes));
                      _ = ObjReader.Read(new MemoryStream(bytes));
                      _ = ThreeMfReader.Read(new MemoryStream(bytes));
                      _ = GltfReader.Read(bytes);
                  }
              }
          }
          PROBE

          dotnet publish -c Release

          # The link really carried our assemblies into the bundle, rather than merely compiling
          # them — which is the assertion that caught the empty Main above, when the bundle came out
          # holding the framework and probe.wasm and nothing of ours at all.
          #
          # Matched by name and counted rather than by exact filename, because the extension depends
          # on whether Webcil is enabled and that varies by SDK. The listing prints unconditionally:
          # the first failure here needed a local reproduction to understand, which is exactly what a
          # gate's log should make unnecessary.
          bundle=bin/Release/net10.0-browser/browser-wasm/AppBundle
          echo "--- bundle contents ---"
          find "$bundle" -name 'Khalkos3D.*' -printf '%P\n' | sort
          found=$(find "$bundle" -name 'Khalkos3D.Core.*' -o -name 'Khalkos3D.Formats.*' | wc -l)
          if [ "$found" -lt 2 ]; then
            echo "::error::the wasm bundle does not contain both Khalkos3D assemblies"
            find "$bundle" -type f -printf '%P\n' | sort | head -50
            exit 1
          fi
          echo "ok: the asset layer links for browser-wasm"

  pack:
    name: The libraries pack, and carry what they promise
    runs-on: ubuntu-latest
    # Everything green first. A tag that publishes before the render gate has drawn a frame is a
    # package nobody has watched work.
    needs: [test, render, dependencies, wasm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # PACKED ON EVERY RUN, PUBLISHED ONLY FROM A TAG, and the split is the whole point. CupriFace
      # learned this the expensive way: a fully green release shipped a package with none of the
      # natives it advertised, because nothing packed until the tag had already been cut. A pack
      # step that only ever runs during a release is a pack step first tested during a release.
      - name: Pack
        run: |
          set -euo pipefail
          # Tag v0.1.0 means package 0.1.0. Off a tag it is a throwaway version: the point is that
          # packing ran at all, not what it produced.
          VERSION="0.0.0-ci"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "packing $VERSION"
          for proj in src/Khalkos3D.Core src/Khalkos3D.Formats src/Khalkos3D.Gl; do
            dotnet pack "$proj" -c Release -p:Version="$VERSION" -o dist
          done
          ls -l dist

      # The same shape of assertion the dependencies job makes, for the same reason: a claim that
      # lives only in a props file is a claim that can stop being true without anything failing.
      # LICENSE and PACKAGE.md are attached by an ItemGroup in src/Directory.Build.props that is
      # conditioned on IsPackable, and an MIT library whose package carries no licence file is a
      # licensing problem rather than a cosmetic one.
      - name: The packages carry their licence and readme
        run: |
          set -euo pipefail
          fail=0
          for pkg in dist/*.nupkg; do
            listing=$(unzip -l "$pkg")
            echo "--- $(basename "$pkg") ---"
            echo "$listing" | awk 'NF>3 {print $4}' | grep -v '^Name$' || true
            for required in LICENSE PACKAGE.md; do
              echo "$listing" | grep -qE "[[:space:]]$required$" \
                || { echo "::error::$(basename "$pkg") packed without $required"; fail=1; }
            done
            # An empty lib/ would restore cleanly and then fail to resolve a single type.
            echo "$listing" | grep -qE 'lib/net[0-9.]+/Khalkos3D\.[A-Za-z]+\.dll$' \
              || { echo "::error::$(basename "$pkg") has no assembly under lib/"; fail=1; }
          done
          exit $fail

      # Only from a tag. GitHub Packages is a real NuGet feed rather than a file attached to a
      # release, so a consumer adds one source and gets `dotnet add package Khalkos3D.Core` with
      # version resolution and restore.
      #
      # --skip-duplicate because GitHub Packages REFUSES to overwrite a published version: without
      # it, re-running a tag fails on the first package every time.
      - name: Publish to GitHub Packages
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget push 'dist/*.nupkg' \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "$GH_TOKEN" \
            --skip-duplicate
          echo "packages pushed to GitHub Packages for $GITHUB_REPOSITORY_OWNER"
