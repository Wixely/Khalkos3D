name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Three operating systems because the asset layer is meant to be identical on all of them, and
      # the failures that would break that promise are exactly the ones a single runner hides: path
      # separators, line endings, and the current culture. A comma-decimal machine parsing "1.5" as
      # 15 produces a model ten times too big with nothing to indicate why.
      - name: Build
        run: dotnet build StannumFab.slnx -c Release

      - name: Test
        run: dotnet test tests/StannumFab.Tests -c Release --no-build --logger "console;verbosity=normal"

  dependencies:
    name: The shipped libraries depend on nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # THE LICENCE POLICY, ENFORCED RATHER THAN INTENDED. docs/LICENSING.md says Core and Formats
      # use nothing outside the BCL, and that claim is what makes them compile for WebAssembly, iOS
      # and Android with no per-platform matrix and nothing to sign. A policy that depends on
      # remembering is not a policy, so the zero is asserted here — including transitively, which is
      # where an unwanted licence would actually arrive.
      - name: No package references, direct or transitive
        run: |
          set -euo pipefail
          fail=0
          for project in src/StannumFab.Core src/StannumFab.Formats; do
            dotnet restore "$project" > /dev/null
            listing=$(dotnet list "$project" package --include-transitive 2>&1)
            if echo "$listing" | grep -qE '^\s+> '; then
              echo "::error::$project has package references; docs/LICENSING.md says it must have none"
              echo "$listing"
              fail=1
            else
              echo "ok: $project depends on nothing"
            fi
          done
          exit $fail

  wasm:
    name: The asset layer compiles for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm tooling
        run: dotnet workload install wasm-tools

      # The README claims these run in a browser. A claim about a target nobody builds for is one that
      # stops being true quietly — a single BCL call with no wasm implementation is all it takes, and
      # it would be found by a user rather than by us.
      #
      # The probe project is written out here rather than made with `dotnet new`, because the
      # wasmconsole template lives in the EXPERIMENTAL workload rather than wasm-tools. Targeting
      # net10.0-browser is the half that matters: it turns on the platform-compatibility analyser, so
      # an API that browser does not support becomes CA1416 — an error, since warnings are errors —
      # instead of a runtime failure in someone's tab.
      - name: The loaders compile and link for browser-wasm
        run: |
          set -euo pipefail
          rm -rf /tmp/wasmprobe && mkdir -p /tmp/wasmprobe && cd /tmp/wasmprobe

          cat > probe.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-browser</TargetFramework>
              <RuntimeIdentifier>browser-wasm</RuntimeIdentifier>
              <OutputType>Exe</OutputType>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="REPO/src/StannumFab.Formats/StannumFab.Formats.csproj" />
            </ItemGroup>
          </Project>
          CSPROJ
          sed -i "s|REPO|$GITHUB_WORKSPACE|" probe.csproj

          cat > Probe.cs <<'PROBE'
          using System.IO;
          using StannumFab;
          using StannumFab.Formats;

          public static class Probe
          {
              // Every reader is touched, so the analyser sees each one from a browser-targeted
              // compilation and the trimmer cannot decide none of it is reachable.
              public static string Run(byte[] bytes)
              {
                  var scene = ModelReader.Read(bytes, "stl");
                  _ = StlReader.Read(new MemoryStream(bytes));
                  _ = ObjReader.Read(new MemoryStream(bytes));
                  _ = ThreeMfReader.Read(new MemoryStream(bytes));
                  _ = GltfReader.Read(bytes);
                  _ = MeshWelder.Weld(scene.Meshes[0], out _);
                  return $"{scene.TriangleCount} {scene.Bounds} {BoundingBox.Empty.IsEmpty}";
              }

              public static void Main() { }
          }
          PROBE

          dotnet publish -c Release

          # The link really carried our assemblies into the bundle, rather than merely compiling
          # them. Matched by NAME rather than by exact filename: the extension depends on whether
          # Webcil is on, which varies by SDK and configuration, and pinning it made this gate fail
          # on a publish that had in fact succeeded. The listing is printed either way, so a future
          # failure here is diagnosable from the log instead of needing a local reproduction.
          bundle=bin/Release/net10.0-browser/browser-wasm/AppBundle
          echo "--- bundle contents ---"
          find "$bundle" -name 'StannumFab.*' -printf '%P\n' | sort
          found=$(find "$bundle" -name 'StannumFab.Core.*' -o -name 'StannumFab.Formats.*' | wc -l)
          if [ "$found" -lt 2 ]; then
            echo "::error::the wasm bundle does not contain both StannumFab assemblies"
            find "$bundle" -type f -printf '%P\n' | sort | head -50
            exit 1
          fi
          echo "ok: the asset layer links for browser-wasm"
