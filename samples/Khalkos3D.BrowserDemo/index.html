<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khalkos3D in the browser</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0e1014; color: #d8d4cf;
      font: 15px/1.6 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    }
    main { width: min(46rem, 92vw); }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #c77b48; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.5rem; color: #6f7681; }
    pre { margin: 0; white-space: pre-wrap; }
    .row { display: grid; grid-template-columns: 8.5rem 1fr; gap: .1rem 1rem; }
    .row dt { color: #6f7681; }
    .row dd { margin: 0; }
    .bad { color: #d2624a; }
    p.note { margin: 1.5rem 0 0; padding-top: 1.1rem; border-top: 1px solid #23262c; color: #6f7681; }
    p.note b { color: #8b929d; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Khalkos3D</h1>
    <p class="sub">The asset layer, compiled to WebAssembly and reading a real file in this tab.</p>
    <dl class="row" id="out"><dt>status</dt><dd>starting the runtime&hellip;</dd></dl>
    <p class="note" id="why"></p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
